name: "Agentic Fleet: Autonomous 5-Agent SDLC"
description: "Autonomous engineering fleet: PM framing, Architecture gates, TDD implementation, Security audit, and QA."
author: "Dipesh Singh"

branding:
  icon: "cpu"
  color: "purple"

inputs:
  gemini-api-key:
    description: "Google Gemini API Key for LLM reasoning (Optional if using OpenAI or Anthropic)"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API Key for GPT-4o / o3 reasoning (Optional)"
    required: false
    default: ""
  anthropic-api-key:
    description: "Anthropic API Key for Claude 3.5 Sonnet reasoning (Optional)"
    required: false
    default: ""
  ollama-host:
    description: "Local or private Ollama host URL, e.g., http://localhost:11434 (Optional)"
    required: false
    default: ""
  github-token:
    description: "GitHub token for reading issues/PRs, posting reviews, adding labels, and pushing code"
    required: true
    default: ${{ github.token }}
  reviewer-github-token:
    description: "Optional dedicated reviewer token for official PR approvals without author collision"
    required: false
    default: ""
  event-name:
    description: "GitHub event name (issues, pull_request, issue_comment)"
    required: false
    default: ${{ github.event_name }}
  event-path:
    description: "Path to GitHub event JSON payload"
    required: false
    default: ${{ github.event_path }}
  agent-override:
    description: "Explicitly force execution of a specific agent (pm, dev, security, qa, senior-reviewer, autonomous)"
    required: false
    default: ""
  dry-run:
    description: "Simulate agent reasoning and actions without posting to GitHub"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Agentic Fleet Orchestrator
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OLLAMA_HOST: ${{ inputs.ollama-host }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEWER_GITHUB_TOKEN: ${{ inputs.reviewer-github-token }}
        GITHUB_EVENT_NAME: ${{ inputs.event-name }}
        GITHUB_EVENT_PATH: ${{ inputs.event-path }}
        TARGET_WORKSPACE: ${{ github.workspace }}
      run: |
        python -m src.cli \
          --event-name "${{ inputs.event-name }}" \
          --event-path "${{ inputs.event-path }}" \
          ${{ inputs.agent-override != '' && format('--agent {0}', inputs.agent-override) || '' }} \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
